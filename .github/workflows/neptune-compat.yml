name: Neptune Compatibility Tests (disabled - Neptune sunset March 2025)

# Neptune has been sunset as of March 2025. These tests are disabled.
# The compatibility layer code remains for users still migrating.

on:
  workflow_dispatch:  # manual trigger only, if ever needed

permissions: {}

jobs:
  neptune-compatibility:
    # Dual-logging tests authenticate to the live Pluto server; the API
    # token (MLOP_API_TOKEN) is scoped to the "integration" environment.
    environment: integration
    permissions:
      contents: read
    runs-on: ubicloud-standard-4
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        poetry-version: ["2.1.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry==${{ matrix.poetry-version }}

      - name: Install dependencies including neptune-scale
        run: |
          set -euox pipefail
          # Clear stale cached venv that may be missing dev dependencies
          rm -rf .venv
          poetry install --with dev --extras full
          # Verify neptune-scale is installed
          poetry run python -c "import importlib.metadata; import neptune_scale; print(f'neptune-scale version: {importlib.metadata.version(\"neptune-scale\")}')"

      - name: Run Neptune compatibility tests (without pluto config)
        run: |
          set -euox pipefail
          # Test that Neptune works normally without pluto configuration
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneCompatBasic -v -rs
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneCompatAPIForwarding -v -rs
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneCompatFallbackBehavior -v -rs

      - name: Run Neptune error handling tests
        run: |
          set -euox pipefail
          # Test that Neptune never fails due to pluto errors
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneCompatErrorHandling -v -rs

      - name: Run Neptune file conversion tests
        run: |
          set -euox pipefail
          # Test file type conversion
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneCompatFileConversion -v -rs

      - name: Run real Neptune integration tests
        env:
          NEPTUNE_API_TOKEN: ${{ secrets.NEPTUNE_API_TOKEN }}
          NEPTUNE_PROJECT: "asai/test"
        run: |
          set -euox pipefail
          # Test with real Neptune client (without pluto)
          # These tests MUST pass - no fallback to echo
          # Use -s to disable output capture and prevent I/O errors from Neptune's logger
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneRealBackend::test_real_neptune_without_pluto -v -rs -s
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneRealBackend::test_real_neptune_context_manager -v -rs -s

      - name: Setup pluto credentials for dual-logging tests
        env:
          PLUTO_API_KEY: ${{ secrets.MLOP_API_TOKEN }}
        run: |
          set -euox pipefail
          poetry run pluto login "${PLUTO_API_KEY}"

      - name: Run Neptune dual-logging integration tests
        env:
          NEPTUNE_API_TOKEN: ${{ secrets.NEPTUNE_API_TOKEN }}
          NEPTUNE_PROJECT: "asai/test"
          PLUTO_PROJECT: "testing-ci"
          CI: "true"
        run: |
          set -euox pipefail
          # Test dual-logging to both Neptune (mock) and pluto (real)
          # These tests MUST pass - no fallback to echo
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneCompatDualLogging -v -rs
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneCompatIntegration -v -rs
          # Test full dual-logging with both real Neptune and pluto
          # Use -s to disable output capture and prevent I/O errors from Neptune's logger
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneRealBackend::test_real_neptune_with_pluto_dual_logging -v -rs -s
          poetry run pytest tests/test_neptune_compat.py::TestNeptuneRealBackend::test_real_neptune_pluto_resilience -v -rs -s

      - name: Report test results
        if: always()
        run: |
          echo "Neptune compatibility tests completed"
          echo "Python version: ${{ matrix.python-version }}"
          echo "Status: ${{ job.status }}"

  neptune-migration-examples:
    permissions:
      contents: read
    runs-on: ubicloud-standard-4
    strategy:
      matrix:
        python-version: ["3.11"]
        poetry-version: ["2.1.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry==${{ matrix.poetry-version }}

      - name: Install dependencies
        run: |
          set -euox pipefail
          # Clear stale cached venv that may be missing dev dependencies
          rm -rf .venv
          poetry install --with dev --extras full
          pip install -e ".[dev,full]"

      - name: Validate migration example scripts
        run: |
          set -euox pipefail
          # Validate that example scripts have correct syntax
          python -m py_compile examples/neptune_migration_example.py
          echo "✓ Migration example scripts are valid"

      - name: Validate migration documentation
        run: |
          set -euox pipefail
          # Check that documentation exists and has required sections
          test -f examples/neptune_migration_README.md
          grep -q "Quick Start" examples/neptune_migration_README.md
          grep -q "Usage" examples/neptune_migration_README.md
          grep -q "Supported Features" examples/neptune_migration_README.md
          echo "✓ Migration documentation is complete"

  # This job serves as a status check gate
  neptune-compat-status:
    permissions: {}
    runs-on: ubicloud-standard-2
    needs: [neptune-compatibility, neptune-migration-examples]
    if: always()
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.neptune-compatibility.result }}" != "success" ]; then
            echo "❌ Neptune compatibility tests failed"
            exit 1
          fi
          if [ "${{ needs.neptune-migration-examples.result }}" != "success" ]; then
            echo "❌ Neptune migration examples validation failed"
            exit 1
          fi
          echo "✅ All Neptune compatibility checks passed"

