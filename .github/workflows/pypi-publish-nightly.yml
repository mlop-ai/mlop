name: pypi-publish-nightly
on:
  schedule:
    - cron: '35 10 * * *' # 10:35am UTC, 2:35am PST, 5:35am EST
  workflow_dispatch:

permissions: {}

jobs:
  # nightly release check from https://stackoverflow.com/a/67527144
  check-date:
    permissions:
      contents: read
    runs-on: ubicloud-standard-2
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: print latest_commit
        run: echo ${{ github.sha }}
      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="24 hours"  ${{ github.sha }}) && echo "::set-output name=should_run::false"

  nightly-build-pypi:
    # Isolate PyPI publishing from secrets on other branches. The "build"
    # environment can be restricted (via repo settings) to protected branches
    # so rogue workflows on feature branches can't reach its secrets/OIDC.
    environment: build
    permissions:
      contents: read
      id-token: write  # OIDC for PyPI Trusted Publishing
    runs-on: ubicloud-standard-2
    needs: check-date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==2.1.1
      - name: Set release version
        run: |
          # Extract the version number from pyproject.toml using awk
          CURRENT_VERSION=$(awk -F '"' '/version =/ { print $2 }' pyproject.toml | head -n 1)
          # Export the CURRENT_VERSION with the .dev and current date suffix
          NIGHTLY_VERSION="${CURRENT_VERSION}.dev$(date +%Y%m%d%H%M%S)"
          sed -i "s/{{PLUTO_COMMIT_SHA}}/${{ github.sha }}/g" pluto/__init__.py
          sed -i "s/__version__ = '.*'/__version__ = '1.0.0.dev${NIGHTLY_VERSION}'/g" pluto/__init__.py
          sed -i "0,/version = \"${CURRENT_VERSION}\"/s//version = \"${NIGHTLY_VERSION}\"/" pyproject.toml
          sed -i 's/name = "pluto-ml"/name = "pluto-ml-nightly"/g' pyproject.toml
          cat pyproject.toml
          cat pluto/__init__.py

      - name: Build the Python package
        run: poetry build

      - name: Publish the package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0