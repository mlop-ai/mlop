[tool.poetry]
name = "pluto-ml"
version = "0.0.29"
description = "Pluto ML - Machine Learning Operations Framework"
packages = [
    {include = "pluto"},
    {include = "mlop"},
    {include = "_pluto_wandb_hook.py"},
    {include = "zzzz_pluto_wandb_hook.pth"},
]
authors = [
    "jqssun",
    "lakeesiv",
    "asaiacai"
]
readme = "README.md"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.dependencies]
python = "^3.11"
GitPython = ">=3.1"
httpx = { extras = ["http2"], version = ">=0.24,<1.0" }
keyring = ">=24.0"
keyrings-alt = ">=5.0"
numpy = "^2.0"
pillow = ">=13.0.0"  # security floor (Pillow 13.0.0 CVEs); requires Python >=3.11
psutil = ">=5.9"
nvidia-ml-py = ">=11.515.0"
rich = ">=13.0"
sentry-sdk = ">=2.0"
soundfile = ">=0.12"
# migrate extra: wandb -> pluto historical data migration (pluto migrate wandb)
wandb = { version = ">=0.16", optional = true }
pyarrow = { version = ">=15", optional = true }
# sweep extra: Bayesian search for pluto.sweep(method="bayes")
optuna = { version = ">=3.0", optional = true }

[tool.poetry.group.dev.dependencies]
mypy = "^1.10.0"
ruff = "^0.4.7"
griffe = "^2.0"  # static docstring parsing for scripts/gen_api_docs.py
pytest = "^9.0.3"
pytest-xdist = "^3.6.1"
types-colorama = "^0.4.15.20240311"
types-requests = "<2.31.0.7"
types-pyyaml = "^6.0.12.20241230"

# only needed for testing
# Floors are the security minimums (GHSA-rrmf-rvhw-rf47); without them poetry
# is free to resolve backwards. torchvision pins torch exactly (0.28.0 ->
# torch==2.13.0), and its own requires_python excludes 3.14.1 — which the
# project's ^3.11 range includes. Without mirroring that marker here, poetry
# cannot satisfy the full range and silently falls back to torchvision 0.12.0
# (requires_python >=3.7), which has no wheels for 3.11+.
#
# Both are also capped below 3.15. Their metadata claims it (torch says
# >=3.10, torchvision !=3.14.1,>=3.10) but neither publishes a cp315 wheel,
# so resolution succeeds and `poetry install` then fails on 3.15 with
# "Unable to find installation candidates" — the same way torchvision 0.12.0
# failed on 3.11+. The cap makes them simply not apply on 3.15 instead.
# These are dev-only test deps, so this does not constrain what end users
# can install pluto-ml on; lift it when upstream ships cp315 wheels.
torch = { version = ">=2.13.0", python = ">=3.11,<3.15" }
matplotlib = "^3.10"
torchvision = { version = ">=0.28.0", python = "!=3.14.1,>=3.11,<3.15" }
imageio = "^2.37.0"
moviepy = "^1.0.3"
omegaconf = "^2.3"
pyarrow = ">=15"  # pluto.migrate tests
optuna = ">=3.0"  # pluto.sweep bayes tests


[tool.poetry.extras]
full = [
  "nvidia-ml-py",
]
migrate = [
  "wandb",
  "pyarrow",
]
sweep = [
  "optuna",
]

[tool.poetry.scripts]
pluto = 'pluto.__main__:main'
mlop = 'mlop.__main__:main'

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pyflakes, pycodestyle, isort
select = ["F", "E", "W", "I001"]

[tool.ruff.lint.per-file-ignores]
# E402: Module level import not at top of file
# Required in test_neptune_compat.py because logging must be configured
# before importing neptune_scale to prevent I/O errors
"tests/test_neptune_compat.py" = ["E402"]

[tool.ruff.format]
# 5. Use single quotes in `ruff format`.
quote-style = "single"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "distributed: tests that require multi-rank torch.distributed setup",
]
